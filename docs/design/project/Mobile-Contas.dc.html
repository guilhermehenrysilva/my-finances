<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Financeiro — Contas a pagar no celular</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7EE8B4}a:hover{color:#A5F0CB}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0E1110; color: #E6EBE8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.4; display: flex; flex-direction: column">
  <header style="padding: 20px 16px 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em">Contas a pagar</h1>
    <span style="display: flex; align-items: center; gap: 2px; padding: 2px; border-radius: 999px; border: 1px solid #272D2B; background: #161A19">
      <button type="button" aria-label="Mês anterior" style="width: 32px; height: 32px; border: 0; background: transparent; color: #9AA5A0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span style="font-size: 13px; font-weight: 700">Nov</span>
      <button type="button" aria-label="Próximo mês" style="width: 32px; height: 32px; border: 0; background: transparent; color: #9AA5A0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </span>
  </header>

  <main style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; display: flex; flex-direction: column; gap: 12px">
    <section aria-label="Resumo das contas" style="background: #161A19; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; color: #9AA5A0; font-weight: 600">Falta pagar</span>
        <span style="font-size: 13px; color: #9AA5A0; font-weight: 600">{{paidCount}} de 6 pagas</span>
      </div>
      <b style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">{{pendingTotal}}</b>
      <div style="height: 8px; border-radius: 4px; background: #1D2220"><span style="display: block; width: {{pct}}%; height: 100%; border-radius: 4px; background: {{accent}}"></span></div>
    </section>

    <section aria-labelledby="pendentes" style="display: flex; flex-direction: column">
      <h2 id="pendentes" style="margin: 0 0 2px; font-size: 13px; color: #9AA5A0; font-weight: 700">A pagar · toque no quadrado quando pagar</h2>
      <sc-for list="{{pending}}" as="b" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #222826">
          <button type="button" aria-label="{{b.label}}" onClick="{{b.toggle}}" style="flex: none; width: 44px; height: 48px; margin-left: -10px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 8px; border: 2px solid {{b.border}}; box-sizing: border-box"></span></button>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b>{{b.name}}</b><small style="font-size: 13px; color: {{b.subColor}}; font-weight: 600">{{b.sub}}</small></span>
          <b style="font-variant-numeric: tabular-nums">{{b.money}}</b>
        </div>
      </sc-for>
    </section>

    <section aria-labelledby="pagas" style="display: flex; flex-direction: column">
      <h2 id="pagas" style="margin: 0 0 2px; font-size: 13px; color: #9AA5A0; font-weight: 700">Pagas</h2>
      <sc-for list="{{paid}}" as="b" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 10px; padding: 4px 0; border-bottom: 1px solid #222826">
          <button type="button" aria-label="{{b.label}}" onClick="{{b.toggle}}" style="flex: none; width: 44px; height: 48px; margin-left: -10px; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 24px; height: 24px; border-radius: 8px; background: {{accent}}; color: #06140E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span></button>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><b style="color: #9AA5A0; text-decoration: line-through">{{b.name}}</b><small style="font-size: 13px; color: #7EE8B4; font-weight: 600">{{b.sub}}</small></span>
          <b style="color: #9AA5A0; font-variant-numeric: tabular-nums">{{b.money}}</b>
        </div>
      </sc-for>
    </section>

    <button type="button" style="margin-top: auto; min-height: 48px; border: 0; border-radius: 14px; background: {{accent}}; color: #06140E; font: inherit; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>Nova conta</button>
  </main>

  <nav aria-label="Navegação principal" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #161A19; border-top: 1px solid #272D2B; padding: 6px 4px 22px">
    <a href="Mobile-Inicio.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA5A0; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Início</a>
    <a href="Mobile-Contas.dc.html" aria-current="page" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{accent}}; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>Contas</a>
    <a href="Mobile-Lancamentos.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA5A0; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M3 6h.01"></path><path d="M3 12h.01"></path><path d="M3 18h.01"></path></svg>Lançamentos</a>
    <a href="Mobile-Previsao.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA5A0; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 2 7l10 5 10-5-10-5z"></path><path d="m2 17 10 5 10-5"></path><path d="m2 12 10 5 10-5"></path></svg>Previsão</a>
    <a href="Mobile-Mais.dc.html" style="min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #9AA5A0; font-size: 11px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="19" cy="12" r="1.5"></circle></svg>Mais</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#3DD68C","options":["#3DD68C","#2EBD7A","#5EE0A0","#4ADE80"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { paid: { condominio: 'Paga em 02 nov', celular: 'Paga em 03 nov' } };
  }
  renderVals() {
    var bills = [
      { id: 'aluguel', name: 'Aluguel', amount: 650, sub: 'Venceu ontem · 05 nov', late: true },
      { id: 'internet', name: 'Internet', amount: 119.9, sub: 'Vence em 4 dias · 10 nov' },
      { id: 'academia', name: 'Academia', amount: 99, sub: 'Vence 15 nov' },
      { id: 'seguro', name: 'Seguro do carro', amount: 151.11, sub: 'Vence 20 nov' },
      { id: 'condominio', name: 'Condomínio', amount: 420, sub: 'Vence 10 nov' },
      { id: 'celular', name: 'Celular', amount: 49, sub: 'Vence 12 nov' }
    ];
    var paidMap = this.state.paid;
    var self = this;
    var brl = function (v) { return 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); };
    var toggle = function (id) {
      return function () {
        var next = Object.assign({}, self.state.paid);
        if (next[id]) delete next[id]; else next[id] = 'Paga hoje';
        self.setState({ paid: next });
      };
    };
    var pending = [];
    var paid = [];
    var pendingTotal = 0;
    bills.forEach(function (b) {
      if (paidMap[b.id]) {
        paid.push({ name: b.name, money: brl(b.amount), sub: paidMap[b.id], label: 'Desmarcar ' + b.name, toggle: toggle(b.id) });
      } else {
        pendingTotal += b.amount;
        pending.push({ name: b.name, money: brl(b.amount), sub: b.sub, label: 'Marcar ' + b.name + ' como paga', toggle: toggle(b.id), border: b.late ? '#F27171' : '#3A423F', subColor: b.late ? '#F27171' : '#9AA5A0' });
      }
    });
    return {
      accent: this.props.accent ?? '#3DD68C',
      pending: pending,
      paid: paid,
      paidCount: paid.length,
      pendingTotal: brl(pendingTotal),
      pct: Math.round((paid.length / bills.length) * 100)
    };
  }
}
</script>
</body>
</html>
